# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Elec. Wiki
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: my-obsidian.2412nguyenhoanghai.workers.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      title: Inter
      header: Inter
      body: Inter
      code: JetBrains Mono          # đổi từ Inter -> monospace thật, để công thức/code không lệch cột
    colors:
      lightMode:
        light: "#F8FAFC"
        lightgray: "#E2E8F0"
        gray: "#94A3B8"
        darkgray: "#334155"
        dark: "#0F172A"
        secondary: "#0284C7"
        tertiary: "#6366F1"
        highlight: rgba(2, 132, 199, 0.12)
        textHighlight: "#38BDF855"
      darkMode:
        light: "#0B1220"
        lightgray: "#172033"
        gray: "#475569"
        darkgray: "#CBD5E1"
        dark: "#F8FAFC"
        secondary: "#38BDF8"
        tertiary: "#818CF8"
        highlight: rgba(56, 189, 248, 0.15)
        textHighlight: "#38BDF855"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900                       # thêm order còn thiếu ở bản trước
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
    options:
      folderClickBehavior: collapse
      useSavedState: true
  # LƯU Ý: graph dùng đúng dạng "github:..." theo tài liệu chính thức của plugin.
  # (Bản trước mình sửa nhầm thành "@quartz-community/graph" — đã revert lại.)
  - source: github:quartz-community/graph
    enabled: true
    options:
      # Graph nhỏ ở sidebar phải — tinh chỉnh cho mượt & thoáng giống Obsidian
      localGraph:
        drag: true
        zoom: true
        depth: 1
        scale: 1.15
        repelForce: 0.9          # đẩy node xa nhau hơn -> đỡ chồng chữ
        centerForce: 0.28
        linkDistance: 42         # dây dài hơn, nhìn thoáng
        fontSize: 0.55
        opacityScale: 1.1
        removeTags: []
        showTags: true
        focusOnHover: true       # hover node -> làm mờ node không liên quan (giống Obsidian)
        enableRadial: false
      # Graph toàn cục (bấm icon graph hoặc Ctrl/Cmd + G để mở fullscreen)
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 0.85
        repelForce: 1.1          # cụm tách rõ ràng, không dính chùm
        centerForce: 0.2
        linkDistance: 55
        fontSize: 0.6
        opacityScale: 1.2
        removeTags: []
        showTags: true
        focusOnHover: true
        enableRadial: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true                        # bật lại để dùng #iec #ups #generator #datacenter...
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/nguyen-hoang-hai/my-obsidian
        LinkedIn: https://www.linkedin.com/in/nhhai/
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: true                        # bật lại để trang chủ giống dashboard kiến thức
    options:
      limit: 10
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
