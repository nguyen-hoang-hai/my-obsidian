# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Elec. Wiki
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: my-obsidian.2412nguyenhoanghai.workers.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      title: Inter
      header: Inter
      body: Inter
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#F8FAFC"
        lightgray: "#E2E8F0"
        gray: "#64748B"
        darkgray: "#334155"
        dark: "#0F172A"
        secondary: "#0284C7"
        tertiary: "#6366F1"
        highlight: rgba(2, 132, 199, 0.12)
        textHighlight: "#38BDF855"
      darkMode:
        light: "#0B1220"
        lightgray: "#172033"
        gray: "#475569"
        darkgray: "#CBD5E1"
        dark: "#F8FAFC"
        secondary: "#38BDF8"
        tertiary: "#818CF8"
        highlight: rgba(56, 189, 248, 0.15)
        textHighlight: "#38BDF855"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10          # ĐỔI: mục lục lên đầu cột phải
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  # ĐỔI: cột trái chỉ còn Explorer (cây thư mục như mục lục wiki)
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 10
    options:
      folderClickBehavior: collapse
      useSavedState: true
  # ĐỔI: graph xuống dưới mục lục
  - source: github:quartz-community/graph
    enabled: true
    options:
      localGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 0.95
        repelForce: 0.75
        centerForce: 0.3
        linkDistance: 45
        fontSize: 0.52
        opacityScale: 1.0
        removeTags: ["#"]
        showTags: false
        focusOnHover: true
        enableRadial: false
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 1.0
        repelForce: 0.85
        centerForce: 0.28
        linkDistance: 45
        fontSize: 0.45
        opacityScale: 1.0
        removeTags: ["#"]
        showTags: false
        focusOnHover: true
        enableRadial: false
    layout:
      position: right
      priority: 30
  # ĐỔI: thanh tìm kiếm lên HEADER (thanh đầu trang), kéo dài ở giữa
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 20
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # ĐỔI: tên site lên HEADER, bên trái
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: header
      priority: 10
  # ĐỔI: nút sáng/tối và chế độ đọc lên HEADER, bên phải
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 30
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: header
      priority: 35
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/nguyen-hoang-hai/my-obsidian
        LinkedIn: https://www.linkedin.com/in/nhhai/
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
    options:
      limit: 10
  - source: "@quartz-community/spacer"
    enabled: false           # ĐỔI: không còn dùng vì đã bỏ toolbar ở cột trái
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
